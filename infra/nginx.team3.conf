# 화면(web/out 정적 파일) + /api/ 는 FastAPI로 넘김 → 화면과 API가 같은 주소 (CORS 없음, API 포트를 밖에 안 엶)
server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s;          # api 컨테이너가 늦게 떠도 nginx가 멈추지 않게
    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;            # /api/ask는 n8n 본체를 기다림 (FastAPI 쪽 15초)
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
